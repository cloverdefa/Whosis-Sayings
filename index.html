<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聊天室</title>

  <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/bulma/0.8.2/css/bulma.min.css">
  <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">
  <link rel="stylesheet" href="//fonts.googleapis.com/css?family=Rubik&display=swap">

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #18232c;
      font-family: 'Rubik', sans-serif;
    }

    [v-cloak] {
      display: none;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 16px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .message-row {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }

    .message-row.right {
      flex-direction: row-reverse;
    }

    .message-bubble {
      position: relative;
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      background: #2a3744;
      color: #fff;
      line-height: 1.5;
    }

    .message-row.right .message-bubble {
      background: #4a90e2;
    }

    .message-bubble::after {
      content: "";
      position: absolute;
      top: 10px;
      width: 0;
      height: 0;
      border: 8px solid transparent;
    }

    .message-row.left .message-bubble::after {
      left: -16px;
      border-right-color: #2a3744;
    }

    .message-row.right .message-bubble::after {
      right: -16px;
      border-left-color: #4a90e2;
    }

    .message-header {
      margin-bottom: 6px;
      font-size: .9rem;
      font-weight: bold;
    }

    .message-meta {
      margin-left: 6px;
      font-size: .75rem;
      color: #ccc;
    }

    .message-content {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-content del {
      color: #bfbfbf;
      opacity: .75;
    }

    .message-content b,
    .message-content strong {
      font-weight: 700;
    }

    .message-content i,
    .message-content em {
      font-style: italic;
    }

    .image img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
    }

    @media (max-width: 768px) {
      .message-bubble {
        max-width: 90%;
        font-size: .95rem;
      }

      .image img {
        width: 40px;
        height: 40px;
      }
    }

    @media (max-width: 480px) {
      .message-bubble {
        padding: 10px 14px;
        font-size: .9rem;
      }
    }
  </style>

  <script>
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      location.protocol = 'https:'
    }
  </script>
</head>

<body>

<div id="app" class="chat-container" v-cloak>

  <div
    v-for="(m, i) in messages"
    :key="i"
    class="message-row"
    :class="{ right: m.uname === selfUname, left: m.uname !== selfUname }">

    <figure class="image media-left">
      <img :src="m.avatar" :alt="m.name">
    </figure>

    <div class="message-bubble">

      <div class="message-header">
        {{ m.name }}
        <span class="message-meta">
          {{ relativeTime(m.ts) }}
        </span>
      </div>

      <div
        class="message-content"
        v-html="m.text">
      </div>

    </div>

  </div>

</div>

<script src="public/main.js"></script>

</body>
</html>
