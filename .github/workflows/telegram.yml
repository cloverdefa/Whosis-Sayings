name: Telegram Notification
on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
permissions:
  contents: read
jobs:
  notify:
    name: Send Telegram Notification
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_OUTPUT"

      - name: Get commit changes
        id: changes
        run: |
          tag="${{ steps.release.outputs.tag }}"

          # 沿著 commit 歷史往回找上一個 tag,不依賴 tag 建立時間
          prev_tag=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || echo "")

          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..${tag}"
          else
            range="${tag}"
          fi

          commits=$(git log "$range" --pretty=format:'%H')

          log=""
          while IFS= read -r hash; do
            [ -n "$hash" ] && log="${log}https://github.com/${GITHUB_REPOSITORY}/commit/${hash}"$'\n'
          done <<< "$commits"

          {
            echo "changes<<EOF"
            printf '%s' "$log"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.GROUPS_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            📦 儲存庫
            ${{ github.repository }}
            🏷️ 版本
            ${{ steps.release.outputs.tag }}
            📝 變更內容
            ${{ steps.changes.outputs.changes }}

