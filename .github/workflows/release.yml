name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_type:
        description: Release version type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    # ==============================================================
    # 僅允許：
    # 1. 手動觸發 (workflow_dispatch)
    # 2. PR 被成功合併，且來源分支為 'test'、目標分支為 'main'
    # ==============================================================
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'test'
      )

    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Checkout main
      # ============================================================

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # Get next version
      # ============================================================

      - name: Get next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          # ----------------------------------------------------------
          # Find latest semantic version tag
          #
          # Supported:
          #   v1.0.0
          #   v1.1.0
          #   v2.0.0
          # ----------------------------------------------------------

          latest_tag="$(
            git tag --list 'v*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )"

          echo "Latest tag: ${latest_tag:-none}"

          # ----------------------------------------------------------
          # Determine release type
          #
          # workflow_dispatch:
          #   Use manually selected release type.
          #
          # pull_request:
          #   Analyze commits since latest release.
          #
          # Priority:
          #   major > minor > patch > none
          # ----------------------------------------------------------

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            release_type="${{ inputs.release_type }}"

            echo "Trigger: workflow_dispatch"
            echo "Release type: $release_type"

          else

            release_type="none"

            echo "Trigger: pull_request"
            echo "Analyzing commits since latest release..."

            # --------------------------------------------------------
            # Get commits
            #
            # Use ASCII Record Separator (0x1E) to separate commits.
            # This prevents commit body lines from being treated as
            # independent commits.
            # --------------------------------------------------------

            if [ -n "$latest_tag" ]; then

              commits="$(
                git log \
                  "$latest_tag..HEAD" \
                  --pretty=format:'%x1e%s%n%b'
              )"

            else

              commits="$(
                git log \
                  --pretty=format:'%x1e%s%n%b'
              )"

            fi

            # --------------------------------------------------------
            # Analyze each commit
            # --------------------------------------------------------

            while IFS= read -r commit; do

              commit="${commit#"${commit%%[![:space:]]*}"}"
              commit="${commit%"${commit##*[![:space:]]}"}"

              [ -z "$commit" ] && continue

              echo "----------------------------------------"
              echo "Commit:"
              echo "$commit"

              # ------------------------------------------------------
              # MAJOR
              #
              # Examples:
              #   feat!: ...
              #   fix!: ...
              #   refactor!: ...
              #   feat(scope)!: ...
              #
              # Also:
              #   BREAKING CHANGE:
              # ------------------------------------------------------

              if \
                printf '%s\n' "$commit" |
                grep -qE '^[a-zA-Z0-9_-]+(\([^)]*\))?!:' ||
                printf '%s\n' "$commit" |
                grep -q 'BREAKING CHANGE:'
              then
                release_type="major"
                continue
              fi

              # ------------------------------------------------------
              # MINOR
              #
              # Examples:
              #   feat: ...
              #   feat(scope): ...
              # ------------------------------------------------------

              if printf '%s\n' "$commit" |
                grep -qE '^feat(\([^)]*\))?:'
              then

                if [ "$release_type" != "major" ]; then
                  release_type="minor"
                fi

                continue
              fi

              # ------------------------------------------------------
              # PATCH
              #
              # Examples:
              #   fix: ...
              #   fix(scope): ...
              # ------------------------------------------------------

              if printf '%s\n' "$commit" |
                grep -qE '^fix(\([^)]*\))?:'
              then

                if [ "$release_type" = "none" ]; then
                  release_type="patch"
                fi

                continue
              fi

            done < <(
              printf '%s' "$commits" |
              tr '\036' '\n'
            )

            echo "----------------------------------------"
            echo "Detected release type: $release_type"

            # --------------------------------------------------------
            # No release required
            # --------------------------------------------------------

            if [ "$release_type" = "none" ]; then

              echo "No release required."

              echo "should_release=false" >> "$GITHUB_OUTPUT"

              exit 0
            fi
          fi

          # ----------------------------------------------------------
          # Calculate next version
          # ----------------------------------------------------------

          if [ -z "$latest_tag" ]; then

            case "$release_type" in

              patch)
                major=0
                minor=1
                patch=1
                ;;

              minor)
                major=0
                minor=2
                patch=0
                ;;

              major)
                major=1
                minor=0
                patch=0
                ;;

              *)
                echo "::error::Invalid release type: $release_type"
                exit 1
                ;;

            esac

          else

            version="${latest_tag#v}"

            IFS='.' read -r major minor patch <<< "$version"

            case "$release_type" in

              patch)
                patch=$((patch + 1))
                ;;

              minor)
                minor=$((minor + 1))
                patch=0
                ;;

              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;

              *)
                echo "::error::Invalid release type: $release_type"
                exit 1
                ;;

            esac
          fi

          version="${major}.${minor}.${patch}"
          tag="v${version}"

          # ----------------------------------------------------------
          # Prevent duplicate tag
          # ----------------------------------------------------------

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi

          echo "Release type: $release_type"
          echo "Next version: $version"
          echo "Next tag: $tag"

          # ----------------------------------------------------------
          # GitHub Actions outputs
          # ----------------------------------------------------------

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Create Release
      # ============================================================

      - name: Create Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
