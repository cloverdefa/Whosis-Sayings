name: Release

on:
  # ==============================================================
  # 自動 Release
  #
  # 僅監聽 main 分支上的 PR closed。
  # Job 內再限制必須是 test → main 且成功 merge。
  # ==============================================================

  pull_request:
    types:
      - closed
    branches:
      - main

  # ==============================================================
  # 手動 Release
  # ==============================================================

  workflow_dispatch:
    inputs:
      release_type:
        description: Release version type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch


# ================================================================
# Workflow permissions
# ================================================================

permissions:
  contents: write


jobs:

  # ==================================================================
  # Job 1: 判斷下一個版本
  # ==================================================================

  version:
    name: Determine Version

    # ==============================================================
    # 僅允許：
    #
    # 1. workflow_dispatch
    #
    # 2. test → main 且成功 merge
    # ==============================================================

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'test'
      )

    runs-on: ubuntu-latest

    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      release_type: ${{ steps.version.outputs.release_type }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target_sha: ${{ steps.version.outputs.target_sha }}

    steps:

      # ============================================================
      # Checkout
      #
      # PR：
      #   使用實際 merge commit
      #
      # workflow_dispatch：
      #   使用 main
      #
      # 避免 workflow 執行期間 main 移動造成 Release
      # 指向與分析時不同的 commit。
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.merge_commit_sha
              || 'main'
            }}
          fetch-depth: 0


      # ============================================================
      # Determine Version
      # ============================================================

      - name: Determine Version
        id: version
        shell: bash
        run: |
          set -euo pipefail


          # ==========================================================
          # Configuration
          # ==========================================================

          # ----------------------------------------------------------
          # First release version
          #
          # 維持目前 REPO 的版本策略：
          #
          #   patch → v0.1.1
          #   minor → v0.2.0
          #   major → v1.0.0
          # ----------------------------------------------------------

          INITIAL_PATCH_VERSION="v0.1.1"
          INITIAL_MINOR_VERSION="v0.2.0"
          INITIAL_MAJOR_VERSION="v1.0.0"


          # ==========================================================
          # Functions
          # ==========================================================


          # ----------------------------------------------------------
          # Find latest semantic version tag
          #
          # 僅接受：
          #
          #   v1.0.0
          #   v1.2.3
          #   v10.20.30
          #
          # 不接受：
          #
          #   v1.0.0-test
          #   v1.0.0-rc1
          # ----------------------------------------------------------

          get_latest_tag() {
            git tag --list 'v*.*.*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 ||
              true
          }


          # ----------------------------------------------------------
          # Check whether a string matches a regex
          #
          # 使用 printf 避免 echo 對特殊字元的處理差異。
          # ----------------------------------------------------------

          matches() {
            local value="$1"
            local pattern="$2"

            printf '%s\n' "$value" |
              grep -Eq "$pattern"
          }


          # ----------------------------------------------------------
          # Analyze one Commit
          #
          # 回傳：
          #
          #   major
          #   minor
          #   patch
          #   none
          #
          # 注意：
          #
          # 只有最後一行輸出 bump type。
          # 除錯資訊全部輸出至 stderr。
          #
          # 如此可以避免：
          #
          #   tail -n 1
          #
          # 因為未來增加 log 而產生誤判。
          # ----------------------------------------------------------

          get_commit_bump() {
            local sha="$1"

            local subject
            local body


            subject="$(git show -s --format='%s' "$sha")"
            body="$(git show -s --format='%b' "$sha")"


            # --------------------------------------------------------
            # Debug information
            # --------------------------------------------------------

            {
              echo ""
              echo "----------------------------------------"
              echo "Commit : $sha"
              echo "Subject: $subject"
            } >&2


            # ========================================================
            # MAJOR
            # ========================================================

            # --------------------------------------------------------
            # 1. Custom MAJOR CHANGE
            #
            #    MAJOR CHANGE: remove old API
            # --------------------------------------------------------

            if matches "$subject" '^MAJOR CHANGE:'; then
              echo "major"
              return
            fi


            if matches "$body" '^MAJOR CHANGE:'; then
              echo "major"
              return
            fi


            # --------------------------------------------------------
            # 2. Conventional Commit breaking change
            #
            #    feat!:
            #    fix!:
            #    refactor!:
            #
            #    feat(api)!:
            # --------------------------------------------------------

            if matches "$subject" '^[a-zA-Z0-9_-]+(\([^)]*\))?!:'; then
              echo "major"
              return
            fi


            # --------------------------------------------------------
            # 3. Traditional Chinese breaking change
            #
            #    新增!:
            #    功能!:
            #    修正!:
            #    修復!:
            #
            #    新增(core)!:
            #    功能(core)!：
            #
            # 支援：
            #
            #    :
            #    ：
            # --------------------------------------------------------

            if matches "$subject" '^(新增|功能|修正|修復)(\([^)]*\))?![:：]'; then
              echo "major"
              return
            fi


            # --------------------------------------------------------
            # 4. BREAKING CHANGE
            #
            #    BREAKING CHANGE: remove old API
            #
            # 必須位於 Body 的行首。
            # --------------------------------------------------------

            if matches "$body" '^BREAKING CHANGE:'; then
              echo "major"
              return
            fi


            # ========================================================
            # MINOR
            # ========================================================

            # --------------------------------------------------------
            # Conventional Commit
            #
            #    feat:
            #    feat(scope):
            # --------------------------------------------------------

            if matches "$subject" '^feat(\([^)]*\))?:'; then
              echo "minor"
              return
            fi


            # --------------------------------------------------------
            # Traditional Chinese
            #
            #    新增:
            #    新增：
            #    新增(scope):
            #    新增(scope)：
            #
            #    功能:
            #    功能：
            #    功能(scope):
            #    功能(scope)：
            # --------------------------------------------------------

            if matches "$subject" '^(新增|功能)(\([^)]*\))?[:：]'; then
              echo "minor"
              return
            fi


            # ========================================================
            # PATCH
            # ========================================================

            # --------------------------------------------------------
            # English
            #
            #    fix:
            #    fix(scope):
            #
            #    chore:
            #    chore(scope):
            # --------------------------------------------------------

            if matches "$subject" '^(fix|chore)(\([^)]*\))?:'; then
              echo "patch"
              return
            fi


            # --------------------------------------------------------
            # Traditional Chinese
            #
            #    修正:
            #    修正：
            #    修正(scope):
            #    修正(scope)：
            #
            #    修復:
            #    修復：
            #    修復(scope):
            #    修復(scope)：
            # --------------------------------------------------------

            if matches "$subject" '^(修正|修復)(\([^)]*\))?[:：]'; then
              echo "patch"
              return
            fi


            # ========================================================
            # NONE
            # ========================================================

            echo "none"
          }


          # ----------------------------------------------------------
          # Analyze all commits
          #
          # Release priority:
          #
          #   major > minor > patch > none
          #
          # 一旦找到 major 即可停止。
          # ----------------------------------------------------------

          get_release_bump() {
            local commit_range="$1"

            local release_type="none"
            local commit_bump
            local sha


            while IFS= read -r sha; do

              [[ -z "$sha" ]] && continue


              commit_bump="$(get_commit_bump "$sha")"


              {
                echo "Commit bump: $commit_bump"
              } >&2


              case "$commit_bump" in

                major)
                  release_type="major"
                  ;;

                minor)
                  if [[ "$release_type" != "major" ]]; then
                    release_type="minor"
                  fi
                  ;;

                patch)
                  if [[ "$release_type" == "none" ]]; then
                    release_type="patch"
                  fi
                  ;;

                none)
                  ;;

                *)
                  echo "::error::Unknown bump type: $commit_bump" >&2
                  return 1
                  ;;

              esac


              # ------------------------------------------------------
              # MAJOR 是最高等級。
              # ------------------------------------------------------

              if [[ "$release_type" == "major" ]]; then
                echo "Highest release level reached: MAJOR" >&2
                break
              fi

            done < <(
              git rev-list "$commit_range"
            )


            echo "$release_type"
          }


          # ----------------------------------------------------------
          # Calculate next version
          # ----------------------------------------------------------

          calculate_next_version() {
            local latest_tag="$1"
            local release_type="$2"


            # ========================================================
            # First release
            # ========================================================

            if [[ -z "$latest_tag" ]]; then

              case "$release_type" in

                patch)
                  echo "$INITIAL_PATCH_VERSION"
                  ;;

                minor)
                  echo "$INITIAL_MINOR_VERSION"
                  ;;

                major)
                  echo "$INITIAL_MAJOR_VERSION"
                  ;;

                *)
                  echo "::error::Invalid release type: $release_type" >&2
                  return 1
                  ;;

              esac

              return
            fi


            # ========================================================
            # Parse latest version
            # ========================================================

            local version="${latest_tag#v}"

            local major
            local minor
            local patch


            IFS='.' read -r major minor patch <<< "$version"


            # ========================================================
            # Apply version bump
            # ========================================================

            case "$release_type" in

              patch)
                patch=$((patch + 1))
                ;;

              minor)
                minor=$((minor + 1))
                patch=0
                ;;

              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;

              *)
                echo "::error::Invalid release type: $release_type" >&2
                return 1
                ;;

            esac


            echo "v${major}.${minor}.${patch}"
          }


          # ==========================================================
          # Fetch tags
          # ==========================================================

          echo "========================================"
          echo "Fetching tags"
          echo "========================================"

          git fetch --tags --force


          # ==========================================================
          # Determine target commit
          # ==========================================================

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then

            TARGET_SHA="${{ github.event.pull_request.merge_commit_sha }}"

          else

            TARGET_SHA="$(git rev-parse main)"

          fi


          echo "Target commit: $TARGET_SHA"


          # ==========================================================
          # Ensure target commit exists
          # ==========================================================

          git fetch origin "$TARGET_SHA"


          # ==========================================================
          # Find latest release tag
          # ==========================================================

          LATEST_TAG="$(get_latest_tag)"


          echo "Latest release tag: ${LATEST_TAG:-none}"


          # ==========================================================
          # Determine commit range
          # ==========================================================

          if [[ -n "$LATEST_TAG" ]]; then

            COMMIT_RANGE="${LATEST_TAG}..${TARGET_SHA}"

          else

            COMMIT_RANGE="$TARGET_SHA"

          fi


          echo "Commit range: $COMMIT_RANGE"


          # ==========================================================
          # Determine release type
          # ==========================================================

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            # --------------------------------------------------------
            # 手動 Release
            #
            # 完全按照使用者指定。
            # 不分析 Commit。
            # --------------------------------------------------------

            RELEASE_TYPE="${{ inputs.release_type }}"

            echo ""
            echo "Trigger       : workflow_dispatch"
            echo "Release type  : $RELEASE_TYPE"

          else

            # --------------------------------------------------------
            # 自動 Release
            #
            # 根據 latest release tag 到 target commit 之間的
            # 所有 Commit 判斷版本。
            # --------------------------------------------------------

            RELEASE_TYPE="$(
              get_release_bump "$COMMIT_RANGE"
            )"

            echo ""
            echo "Trigger       : pull_request"
            echo "Release type  : $RELEASE_TYPE"


            # --------------------------------------------------------
            # 沒有符合 Release 條件
            # --------------------------------------------------------

            if [[ "$RELEASE_TYPE" == "none" ]]; then

              echo ""
              echo "========================================"
              echo "No release required."
              echo "========================================"

              {
                echo "should_release=false"
                echo "release_type=none"
              } >> "$GITHUB_OUTPUT"

              exit 0

            fi

          fi


          # ==========================================================
          # Validate release type
          # ==========================================================

          case "$RELEASE_TYPE" in

            patch|minor|major)
              ;;

            *)
              echo "::error::Invalid release type: $RELEASE_TYPE"
              exit 1
              ;;

          esac


          # ==========================================================
          # Calculate next version
          # ==========================================================

          NEXT_VERSION="$(
            calculate_next_version \
              "$LATEST_TAG" \
              "$RELEASE_TYPE"
          )"


          VERSION="${NEXT_VERSION#v}"
          TAG="$NEXT_VERSION"


          # ==========================================================
          # Validate generated tag
          # ==========================================================

          if ! matches "$TAG" '^v[0-9]+\.[0-9]+\.[0-9]+$'; then

            echo "::error::Invalid generated tag: $TAG"
            exit 1

          fi


          # ==========================================================
          # Prevent duplicate local tag
          # ==========================================================

          if git tag --list "$TAG" |
            grep -Fxq "$TAG"; then

            echo "::error::Tag $TAG already exists locally."
            exit 1

          fi


          # ==========================================================
          # Prevent duplicate remote tag
          # ==========================================================

          if git ls-remote \
            --tags \
            origin \
            "refs/tags/$TAG" |
            grep -q "refs/tags/$TAG"; then

            echo "::error::Tag $TAG already exists on origin."
            exit 1

          fi


          # ==========================================================
          # Show release information
          # ==========================================================

          echo ""
          echo "========================================"
          echo "Release information"
          echo "========================================"
          echo "Latest tag : ${LATEST_TAG:-none}"
          echo "Release    : $RELEASE_TYPE"
          echo "Version    : $VERSION"
          echo "Tag        : $TAG"
          echo "Commit     : $TARGET_SHA"
          echo "========================================"


          # ==========================================================
          # GitHub Actions outputs
          # ==========================================================

          {
            echo "should_release=true"
            echo "release_type=$RELEASE_TYPE"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "target_sha=$TARGET_SHA"
          } >> "$GITHUB_OUTPUT"


  # ==================================================================
  # Job 2: 建立 GitHub Release
  # ==================================================================

  release:
    name: Create Release

    needs: version

    if: needs.version.outputs.should_release == 'true'

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Create Release
      # ============================================================

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # --------------------------------------------------------
          # Release tag
          # --------------------------------------------------------

          tag_name: ${{ needs.version.outputs.tag }}


          # --------------------------------------------------------
          # Release target
          #
          # 使用 version job 實際分析的 target SHA。
          #
          # PR：
          #   merge_commit_sha
          #
          # workflow_dispatch：
          #   main HEAD
          # --------------------------------------------------------

          target_commitish: ${{ needs.version.outputs.target_sha }}


          # --------------------------------------------------------
          # Release name
          # --------------------------------------------------------

          name: ${{ needs.version.outputs.tag }}


          # --------------------------------------------------------
          # Automatically generate Release Notes
          # --------------------------------------------------------

          generate_release_notes: true

