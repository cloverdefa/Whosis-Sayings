name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_type:
        description: Release version type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch


# ====================================================================
# Permissions
# ====================================================================

permissions:
  contents: write


# ====================================================================
# Concurrency
#
# 避免多個 Release Workflow 同時計算相同版本號。
# ====================================================================

concurrency:
  group: release
  cancel-in-progress: false


jobs:

  # ==================================================================
  # Job: Release
  # ==================================================================

  release:

    # ================================================================
    # 僅允許：
    #
    # 1. 手動觸發 workflow_dispatch
    #
    # 2. PR 成功合併
    #    test -> main
    # ================================================================

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'test'
      )

    runs-on: ubuntu-latest


    steps:

      # ==============================================================
      # Checkout target commit
      #
      # workflow_dispatch:
      #   使用 main
      #
      # pull_request:
      #   使用實際的 merge commit
      #
      # 不再直接 checkout mutable main。
      # ==============================================================

      - name: Checkout target commit
        uses: actions/checkout@v7
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch'
              && 'main'
              || github.event.pull_request.merge_commit_sha
            }}
          fetch-depth: 0


      # ==============================================================
      # Get next version
      # ==============================================================

      - name: Get next version
        id: version
        shell: bash
        run: |

          set -euo pipefail


          # ==========================================================
          # Function: Get latest semantic version tag
          #
          # 僅接受：
          #
          #   v1.0.0
          #   v1.1.0
          #   v2.0.0
          #
          # 不接受：
          #
          #   v1.0
          #   v1.0.0-beta
          #   release-1.0.0
          # ==========================================================

          get_latest_tag() {

            git tag --list 'v*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          }


          # ==========================================================
          # Function: Analyze ONE commit
          #
          # 一個 Commit = 一個分析單位
          #
          # Subject 與 Body 分開取得：
          #
          #   Subject
          #     git show -s --format='%s'
          #
          #   Body
          #     git show -s --format='%b'
          #
          # BREAKING CHANGE:
          #   僅從 Body 判斷。
          # ==========================================================

          get_commit_bump() {

            local sha="$1"
            local subject
            local body


            subject="$(
              git show \
                -s \
                --format='%s' \
                "$sha"
            )"


            body="$(
              git show \
                -s \
                --format='%b' \
                "$sha"
            )"


            echo ""
            echo "----------------------------------------"
            echo "Commit : $sha"
            echo "Subject: $subject"


            if [ -n "$body" ]; then
              echo "Body:"
              echo "$body"
            else
              echo "Body   : <empty>"
            fi


            # --------------------------------------------------------
            # MAJOR
            #
            # Conventional Commit:
            #
            #   feat!:
            #   fix!:
            #   chore!:
            #
            #   feat(scope)!:
            #   fix(scope)!:
            #
            # Body:
            #
            #   BREAKING CHANGE:
            # --------------------------------------------------------

            if \
              printf '%s\n' "$subject" |
                grep -qE '^[a-zA-Z0-9_-]+(\([^)]*\))?!:' ||
              printf '%s\n' "$body" |
                grep -qE '^BREAKING CHANGE:'
            then

              echo "Detected bump: MAJOR"

              printf '%s\n' "major"

              return
            fi


            # --------------------------------------------------------
            # MINOR
            #
            #   feat:
            #   feat(scope):
            #
            #   新增:
            #   功能:
            # --------------------------------------------------------

            if \
              printf '%s\n' "$subject" |
                grep -qE '^(feat)(\([^)]*\))?:' ||
              printf '%s\n' "$subject" |
                grep -qE '^(新增|功能)(\([^)]*\))?[:：]'
            then

              echo "Detected bump: MINOR"

              printf '%s\n' "minor"

              return
            fi


            # --------------------------------------------------------
            # PATCH
            #
            #   fix:
            #   fix(scope):
            #
            #   chore:
            #   chore(scope):
            #
            #   修正:
            #   修復:
            # --------------------------------------------------------

            if \
              printf '%s\n' "$subject" |
                grep -qE '^(fix|chore)(\([^)]*\))?:' ||
              printf '%s\n' "$subject" |
                grep -qE '^(修正|修復)(\([^)]*\))?[:：]'
            then

              echo "Detected bump: PATCH"

              printf '%s\n' "patch"

              return
            fi


            # --------------------------------------------------------
            # NONE
            #
            # 例如：
            #
            #   docs
            #   refactor
            #   style
            #   test
            #   ci
            #   build
            #   perf
            #
            # 或其他不符合 Release 規則的 Commit。
            # --------------------------------------------------------

            echo "Detected bump: NONE"

            printf '%s\n' "none"
          }


          # ==========================================================
          # Function: Determine release bump
          #
          # 使用 git rev-list 取得 Commit SHA。
          #
          # 每個 Commit 個別分析：
          #
          #   Commit A
          #       ↓
          #   Subject + Body
          #
          #   Commit B
          #       ↓
          #   Subject + Body
          #
          #   Commit C
          #       ↓
          #   Subject + Body
          #
          # Priority:
          #
          #   major > minor > patch > none
          # ==========================================================

          get_release_bump() {

            local commit_range="$1"
            local release_type="none"
            local commit_bump
            local sha


            echo ""
            echo "========================================"
            echo "Commit range: $commit_range"
            echo "========================================"


            while IFS= read -r sha; do

              [ -z "$sha" ] && continue


              # ------------------------------------------------------
              # get_commit_bump 最後一行才是 bump type。
              #
              # 其他輸出保留在 Actions Log。
              # ------------------------------------------------------

              commit_bump="$(
                get_commit_bump "$sha" |
                tail -n 1
              )"


              case "$commit_bump" in

                # ----------------------------------------------------
                # MAJOR
                # ----------------------------------------------------

                major)

                  release_type="major"

                  ;;


                # ----------------------------------------------------
                # MINOR
                # ----------------------------------------------------

                minor)

                  if [ "$release_type" != "major" ]; then
                    release_type="minor"
                  fi

                  ;;


                # ----------------------------------------------------
                # PATCH
                # ----------------------------------------------------

                patch)

                  if [ "$release_type" = "none" ]; then
                    release_type="patch"
                  fi

                  ;;


                # ----------------------------------------------------
                # NONE
                # ----------------------------------------------------

                none)
                  ;;


                # ----------------------------------------------------
                # Invalid
                # ----------------------------------------------------

                *)

                  echo "::error::Unknown bump type: $commit_bump"

                  exit 1

                  ;;
              esac


              # ------------------------------------------------------
              # MAJOR 已經是最高優先級。
              #
              # 不需要繼續分析後面的 Commit。
              # ------------------------------------------------------

              if [ "$release_type" = "major" ]; then

                echo ""
                echo "Highest release level reached: MAJOR"

                break
              fi

            done < <(
              git rev-list "$commit_range"
            )


            echo ""
            echo "========================================"
            echo "Detected release type: $release_type"
            echo "========================================"


            printf '%s\n' "$release_type"
          }


          # ==========================================================
          # Function: Calculate next version
          #
          # 沒有既有 Release：
          #
          #   patch -> v0.1.1
          #   minor -> v0.2.0
          #   major -> v1.0.0
          #
          # 已有 Release：
          #
          #   patch -> patch + 1
          #   minor -> minor + 1, patch = 0
          #   major -> major + 1, minor = 0, patch = 0
          # ==========================================================

          get_next_version() {

            local latest_tag="$1"
            local release_type="$2"


            # --------------------------------------------------------
            # Initial release
            # --------------------------------------------------------

            if [ -z "$latest_tag" ]; then

              case "$release_type" in

                patch)

                  echo "v0.1.1"

                  ;;

                minor)

                  echo "v0.2.0"

                  ;;

                major)

                  echo "v1.0.0"

                  ;;

                *)

                  echo "::error::Invalid release type: $release_type"

                  exit 1

                  ;;
              esac

              return
            fi


            # --------------------------------------------------------
            # Existing release
            # --------------------------------------------------------

            local version="${latest_tag#v}"
            local major
            local minor
            local patch


            IFS='.' read -r major minor patch <<< "$version"


            case "$release_type" in

              patch)

                patch=$((patch + 1))

                ;;

              minor)

                minor=$((minor + 1))
                patch=0

                ;;

              major)

                major=$((major + 1))
                minor=0
                patch=0

                ;;

              *)

                echo "::error::Invalid release type: $release_type"

                exit 1

                ;;
            esac


            echo "v${major}.${minor}.${patch}"
          }


          # ==========================================================
          # Fetch tags
          # ==========================================================

          git fetch --tags --force


          # ==========================================================
          # Determine target SHA
          #
          # workflow_dispatch:
          #   main HEAD
          #
          # pull_request:
          #   PR merge commit
          # ==========================================================

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            target_sha="$(
              git rev-parse main
            )"

            echo "Trigger       : workflow_dispatch"
            echo "Target branch : main"

          else

            target_sha="${{ github.event.pull_request.merge_commit_sha }}"

            echo "Trigger       : pull_request"
            echo "Source branch : ${{ github.event.pull_request.head.ref }}"
            echo "Target branch : ${{ github.event.pull_request.base.ref }}"

          fi


          # ==========================================================
          # Validate target SHA
          # ==========================================================

          if [ -z "$target_sha" ]; then

            echo "::error::Target SHA is empty."

            exit 1

          fi


          echo "Target SHA    : $target_sha"


          # ==========================================================
          # Find latest release tag
          # ==========================================================

          latest_tag="$(
            get_latest_tag
          )"


          echo "Latest tag    : ${latest_tag:-none}"


          # ==========================================================
          # Determine release type
          # ==========================================================

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            # --------------------------------------------------------
            # Manual release
            #
            # 完全使用 workflow_dispatch 指定的版本類型。
            # --------------------------------------------------------

            release_type="${{ inputs.release_type }}"

            echo ""
            echo "Manual release type: $release_type"

          else

            # --------------------------------------------------------
            # Automatic release
            #
            # 分析最新 Release 之後的 Commit。
            # --------------------------------------------------------

            if [ -n "$latest_tag" ]; then

              commit_range="${latest_tag}..${target_sha}"

            else

              commit_range="$target_sha"

            fi


            release_type="$(
              get_release_bump "$commit_range" |
              tail -n 1
            )"


            # --------------------------------------------------------
            # No release required
            # --------------------------------------------------------

            if [ "$release_type" = "none" ]; then

              echo ""
              echo "No release required."

              echo "should_release=false" >> "$GITHUB_OUTPUT"

              exit 0

            fi

          fi


          # ==========================================================
          # Calculate next version
          # ==========================================================

          tag="$(
            get_next_version \
              "$latest_tag" \
              "$release_type"
          )"


          version="${tag#v}"


          # ==========================================================
          # Validate generated tag
          # ==========================================================

          if ! printf '%s\n' "$tag" |
            grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'
          then

            echo "::error::Invalid generated tag: $tag"

            exit 1

          fi


          # ==========================================================
          # Prevent duplicate local tag
          # ==========================================================

          if git tag --list "$tag" |
            grep -Fxq "$tag"
          then

            echo "::error::Tag $tag already exists locally."

            exit 1

          fi


          # ==========================================================
          # Prevent duplicate remote tag
          # ==========================================================

          if git ls-remote \
            --tags \
            origin \
            "refs/tags/$tag" |
            grep -q "refs/tags/$tag"
          then

            echo "::error::Tag $tag already exists on origin."

            exit 1

          fi


          # ==========================================================
          # Release summary
          # ==========================================================

          echo ""
          echo "========================================"
          echo "Release summary"
          echo "========================================"
          echo "Release type : $release_type"
          echo "Version      : $version"
          echo "Tag          : $tag"
          echo "Target SHA   : $target_sha"
          echo "========================================"


          # ==========================================================
          # GitHub Actions outputs
          # ==========================================================

          {
            echo "should_release=true"
            echo "release_type=$release_type"
            echo "version=$version"
            echo "tag=$tag"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"


      # ==============================================================
      # Create Release
      # ==============================================================

      - name: Create Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}

          # ----------------------------------------------------------
          # 使用實際分析的 Commit。
          #
          # 不再使用：
          #
          #   target_commitish: main
          #
          # 避免 main 在 Workflow 執行期間發生變化。
          # ----------------------------------------------------------

          target_commitish: ${{ steps.version.outputs.target_sha }}

          name: ${{ steps.version.outputs.tag }}

          generate_release_notes: true
